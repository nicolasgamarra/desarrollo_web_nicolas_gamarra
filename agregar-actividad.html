<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Actividad</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        fieldset legend {
            display: none;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h1>Informar Nueva Actividad</h1>

        <form id="actividadForm">
            
            <fieldset>
                <label for="region">Región</label>
                <select id= "region" name="region"></select>

                <label for= "comuna">Comuna</label>
                <select id= "comuna" name="comuna" ></select>

                <label for="sector">Sector</label>
                <input type="text" id="sector" name="sector" maxlength="100">
            </fieldset>

            
            <fieldset>
                <label for="nombre">Nombre</label>
                <input type= "text" id="nombre" name="nombre" maxlength="200">

                <label for="email">Email</label>
                <input type= email" id="email" name="email" maxlength="100" >

                <label for="celular" >Número de celular</label>
                <input type="tel" id="celular" name="celular" placeholder="+569.12345678">

                <label for="contacto">Contactar por</label>
                <select id="contacto" name="contacto" multiple>
                    <option value="whatsapp"> WhatsApp</option>
                    <option value="telegram">Telegram </option>
                    <option value="x"> X </option>
                    <option value="instagram"> Instagram</option>
                    <option value="tiktok"> TikTok</option>
                    <option value="otra">Otra</option>
                </select>

                <div id="ids-contacto"></div>
            </fieldset>

            
            <fieldset>
                <label for="inicio"> Día y hora de inicio </label>
                <input type="datetime-local" id="inicio" name="inicio">

                <label for="termino"> Día y hora de término </label>
                <input type="datetime-local" id="termino" name="termino">

                <label for="descripcion"> Descripción </label>
                <textarea id="descripcion" name="descripcion" cols="50" rows="10"></textarea>

                <label for="tema"> Tema </label>
                <select id="tema" name="tema">
                    <option value="musica"> Música </option>
                    <option value="deporte"> Deporte </option>
                    <option value="ciencias"> Ciencias </option>
                    <option value="religion"> religion</option>
                    <option value="politica"> politica</option>
                    <option value="tecnologia"> tecnologia</option>
                    <option value="juegos"> juegos</option>
                    <option value="baile"> baile</option>
                    <option value="comida"> comida</option>
                    <option value="otro"> otro </option>
                </select>

                <input type="text" id="tema_otro" name="tema_otro" placeholder="Describa el tema" style="display:none" maxlength="15">

                <label for="fotos">Fotos</label>
                <div id="fotosContainer">
                    <input type="file" name="fotos" id="fotos" accept="image/*">
                </div>
                <button type="button" id="agregarFoto">+ Foto</button>
            </fieldset>

            <br>
            <button type="button" id="agregarActividad">Agregar esta actividad</button>
        </form>

        <div id="confirmacion" style="display:none">
            <p>¿Está seguro que desea agregar esta actividad?</p>
            <button id="confirmar">Sí, estoy seguro</button>
            <button id="cancelar">No, quiero volver al formulario</button>
        </div>

        <div id="mensajeFinal" style="display:none">
            <p>Hemos recibido su información, muchas gracias y suerte en su actividad</p>
            <a href="portada.html">Volver a la portada</a>
        </div>
    </div>

    <script src="region-comuna.js"></script>
    <script src="formulario.js"></script>
</body>
</html>
